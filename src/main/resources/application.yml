spring:
  application:
    name: gebze-varlik-yonetimi

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}}
    username: ${DB_USERNAME:varlik_app}
    password: ${DB_PASSWORD:GebzeVarlik2026}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: GebzeVarlikHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      # Yerel veritabanı henüz açık değilken uygulamanın arayüz modunda başlayabilmesi için:
      initialization-fail-timeout: -1
      data-source-properties:
        oracle.jdbc.timezoneAsRegion: "false"

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        boot:
          allow_jdbc_metadata_access: false
        format_sql: true
        jdbc:
          time_zone: Europe/Istanbul

  flyway:
    enabled: ${DB_MIGRATION_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    hsts:
      enabled: ${SECURITY_HSTS_ENABLED:false}
    cookie:
      secure: ${COOKIE_SECURE:false}
