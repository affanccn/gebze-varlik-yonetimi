# =============================================================================
# GEBZE BELEDİYESİ KURUMSAL VARLIK VE KAYNAK YÖNETİM SİSTEMİ (GEBZE-EKYS)
# Üretim (Production) Ortamı Yapılandırması (application-prod.yml)
# =============================================================================

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}}
    username: ${DB_USERNAME:varlik_app}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: GebzeVarlikProdHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@gebze.bel.tr}
  security:
    hsts:
      enabled: ${SECURITY_HSTS_ENABLED:true}
    cookie:
      secure: ${COOKIE_SECURE:true}

# Güvenlik ve Gizlilik: Hassas veri, SQL parametreleri veya kimlik belirteçleri loglanmaz
logging:
  level:
    root: INFO
    tr.gov.gebze.varlik: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: WARN
