# =============================================================================
# GEBZE BELEDİYESİ KURUMSAL VARLIK VE KAYNAK YÖNETİM SİSTEMİ (GEBZE-EKYS)
# Üretim (Production) Ortamı Yapılandırması (application-prod.yml)
# =============================================================================

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-exception: false
      include-binding-errors: never
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}}
    username: ${DB_USER:${DB_USERNAME:varlik_app_runtime}}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: GebzeVarlikProdHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}
      connection-init-sql: ${DB_CONNECTION_INIT_SQL:ALTER SESSION SET NLS_COMP=LINGUISTIC NLS_SORT=TURKISH_AI}
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT:30000}
      data-source-properties:
        oracle.jdbc.timezoneAsRegion: "false"
        oracle.net.CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT_MS:10000}
        oracle.jdbc.ReadTimeout: ${DB_READ_TIMEOUT_MS:30000}

  flyway:
    enabled: ${DB_MIGRATION_ENABLED:true}
    locations: ${DB_MIGRATION_LOCATIONS:classpath:db/migration-prod}
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
    baseline-on-migrate: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@gebze.bel.tr}
  security:
    hsts:
      enabled: ${SECURITY_HSTS_ENABLED:true}
    cookie:
      secure: ${COOKIE_SECURE:true}

# Güvenlik ve Gizlilik: Hassas veri, SQL parametreleri veya kimlik belirteçleri loglanmaz
logging:
  level:
    root: INFO
    "[tr.gov.gebze.varlik]": INFO
    "[org.springframework.web]": WARN
    "[org.springframework.security]": WARN
    "[com.zaxxer.hikari]": WARN
